<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Copier du texte</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 1.25rem; line-height: 1.5; }
    main { max-width: 48rem; margin: 0 auto; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
      padding: 1rem;
      border: 1px solid #8886;
      border-radius: .75rem;
      font: 0.98rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: text;
      -webkit-user-select: text;
    }
    button {
      display: inline-block;
      border: 0;
      border-radius: .7rem;
      padding: .85rem 1.2rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      color: white;
      background: #1769e0;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible { outline: 3px solid #78aaff; outline-offset: 3px; }
    #status { min-height: 1.5em; margin-top: .75rem; }
    .hint { opacity: .75; font-size: .9rem; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Texte à copier</h1>
    <pre id="text"></pre>
    <button id="copy" type="button">Copier</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="hint" id="hint"></p>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const text = params.get("text");
      const buttonLabel = params.get("button") || "Copier";

      const textElement = document.getElementById("text");
      const button = document.getElementById("copy");
      const status = document.getElementById("status");
      const hint = document.getElementById("hint");

      button.textContent = buttonLabel;
      document.title = text === null ? "Texte à copier" : "Copier du texte";

      if (text === null || text.length === 0) {
        textElement.textContent = "Aucun texte fourni.";
        status.textContent = "Ajoutez le paramètre ?text=... à l'URL.";
        status.classList.add("error");
        button.disabled = true;
        button.style.opacity = ".5";
        hint.textContent = "Exemple : ?text=Bonjour%20monde";
        return;
      }

      // textContent affiche le texte comme du texte, sans interpréter de HTML.
      textElement.textContent = text;

      async function copyText() {
        status.textContent = "";
        try {
          // Fonctionne normalement dans Safari lorsque la page est servie en HTTPS
          // et que la copie résulte d'un appui explicite de l'utilisateur.
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            status.textContent = "Texte copié dans le presse-papiers.";
            return;
          }
          throw new Error("Clipboard API indisponible");
        } catch (_) {
          // Solution de repli pour les navigateurs qui ne prennent pas l'API en charge.
          try {
            const area = document.createElement("textarea");
            area.value = text;
            area.setAttribute("readonly", "");
            area.style.position = "fixed";
            area.style.opacity = "0";
            area.style.left = "-9999px";
            document.body.appendChild(area);
            area.focus();
            area.select();
            area.setSelectionRange(0, area.value.length);
            const ok = document.execCommand("copy");
            area.remove();
            if (!ok) throw new Error("Échec de la copie");
            status.textContent = "Texte copié dans le presse-papiers.";
          } catch (error) {
            status.textContent = "La copie automatique a échoué. Sélectionnez le texte ci-dessus puis choisissez Copier.";
            status.classList.add("error");
          }
        }
      }

      button.addEventListener("click", copyText);
    })();
  </script>
</body>
</html>
